spring.application.name=campusconnect-backend

# Render injects PORT; locally the API runs on 8080
server.port=${PORT:8080}

# ---------- Database ----------
# Locally these defaults point at your own MySQL server.
# In production (Render) set DB_URL, DB_USERNAME and DB_PASSWORD as environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- CORS ----------
# Comma-separated list of frontend origins allowed to call the API (no trailing slash).
# Wildcards are allowed, e.g. https://campusconnect-*.vercel.app for Vercel preview deployments.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---------- Default administrator ----------
# Created (or synced) on startup. Always override ADMIN_PASSWORD in production.
app.admin.name=${ADMIN_NAME:Campus Administrator}
app.admin.email=${ADMIN_EMAIL:admin@campusconnect.edu}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
